{% set version = "3.3.2" %}

# tixi3 has moved to conda-forge, where it is called "tixi".
# This is a transitional metapackage that only depends on conda-forge::tixi,
# so that environments requesting dlr-sc::tixi3 (directly or via dlr-sc::tigl3)
# get exactly one copy of the library. It must not be installed next to the
# old, self-contained dlr-sc::tixi3 builds (build number 0).
# See https://github.com/DLR-SC/tigl/issues/1462

package:
  name: tixi3
  version: {{ version }}

build:
  number: 1
  script: {{ PYTHON }} {{ RECIPE_DIR }}/write_egg_info.py

requirements:
  host:
    - python {{ python }}

  run:
    - python
    - tixi =={{ version }}

test:
  imports:
    - tixi3.tixi3wrapper
  commands:
    - python -c "import importlib.metadata as m; assert m.version('tixi3') == '{{ version }}'"

about:
  home: https://github.com/DLR-SC/tixi
  license: Apache 2.0
  summary: Transitional package for conda-forge::tixi (Fast and simple XML interface library)
